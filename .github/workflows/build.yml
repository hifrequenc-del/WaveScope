name: Build Hexoscope

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release

      - name: Package DMG
        run: |
          mkdir -p dist
          cp -R build/Hexoscope_artefacts/Release/AU/HEXOSCOPE.component dist/
          cp -R build/Hexoscope_artefacts/Release/VST3/HEXOSCOPE.vst3 dist/
          cp -R build/Hexoscope_artefacts/Release/Standalone/HEXOSCOPE.app dist/
          for f in dist/*; do codesign --force --deep -s - "$f"; done
          hdiutil create -volname Hexoscope -srcfolder dist -ov -format UDZO Hexoscope.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Hexoscope-macOS
          path: Hexoscope.dmg
